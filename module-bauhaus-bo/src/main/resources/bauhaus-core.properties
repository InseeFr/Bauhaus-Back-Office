fr.insee.rmes.bauhaus.lg1 = fr
fr.insee.rmes.bauhaus.lg2 = en
fr.insee.rmes.bauhaus.per_page = 20
fr.insee.rmes.bauhaus.filenames.maxlength=200

fr.insee.rmes.bauhaus.baseGraph = http://rdf.insee.fr/graphes/


###############################
#ADMS
###############################
fr.insee.rmes.bauhaus.adms.graph = adms
fr.insee.rmes.bauhaus.adms.identifiantsAlternatifs.baseURI = identifiantsAlternatifs/jeuDeDonnees

###############################
#DATASET
###############################
fr.insee.rmes.bauhaus.datasets.graph = catalogue
fr.insee.rmes.bauhaus.datasets.record.baseURI = catalogues/entreeCatalogue
fr.insee.rmes.bauhaus.datasets.baseURI = datasets
fr.insee.rmes.bauhaus.theme.graph = concepts
# Type RDF des themes. A surcharger par http://id.insee.fr/concepts/themes/Theme pour la base de diffusion.
fr.insee.rmes.bauhaus.theme.type = http://bauhaus/concepts/themes/Theme


###############################
#DISTRIBUTION
###############################
fr.insee.rmes.bauhaus.distribution.baseURI = catalogues/distribution

###############################
#CONCEPTS AND COLLECTIONS
###############################
fr.insee.rmes.bauhaus.concepts.scheme = concepts/definitions/scheme
fr.insee.rmes.bauhaus.concepts.graph = concepts/definitions
fr.insee.rmes.bauhaus.concepts.baseURI = concepts/definition

fr.insee.rmes.bauhaus.collections.graph = ${fr.insee.rmes.bauhaus.baseGraph}${fr.insee.rmes.bauhaus.concepts.graph}
fr.insee.rmes.bauhaus.collections.baseURI = ${fr.insee.rmes.bauhaus.sesame.gestion.baseURI}/concepts/definitions

fr.insee.rmes.bauhaus.defaultContributor = http://bauhaus/organisations/insee/HIE3014990
# Vérification au démarrage que defaultContributor est une IRI absolue existant en base de gestion
# (DefaultContributorValidator). Activée par défaut ; décommenter pour la désactiver.
#fr.insee.rmes.bauhaus.default-contributor-check-enabled = false
fr.insee.rmes.bauhaus.concepts.maxLengthScopeNote = 350

###############################
#CLASSIFICATIONS
###############################
fr.insee.rmes.bauhaus.classifications.families.graph = codes/nomenclatures


###############################
#OPERATIONS
###############################
fr.insee.rmes.bauhaus.operations.graph = operations

fr.insee.rmes.bauhaus.operations.baseURI = operations/operation
fr.insee.rmes.bauhaus.operations.families.baseURI = operations/famille
fr.insee.rmes.bauhaus.operations.series.baseURI = operations/serie

#OPERATIONS - SIMS
fr.insee.rmes.bauhaus.documentations.baseURI = qualite/rapport
fr.insee.rmes.bauhaus.documentations.graph = qualite/rapport
fr.insee.rmes.bauhaus.documentations.msd.graph = qualite/simsv2fr
fr.insee.rmes.bauhaus.documentations.concepts.graph = concepts/qualite
fr.insee.rmes.bauhaus.documentation.geographie.baseURI = qualite/territoire
fr.insee.rmes.bauhaus.documentation.geographie.graph = qualite/territoires
fr.insee.rmes.bauhaus.documentation.titlePrefixLg1 = Rapport qualit\u00E9 :
fr.insee.rmes.bauhaus.documentation.titlePrefixLg2 = Quality report:

#OPERATIONS - DOCUMENTS
fr.insee.rmes.bauhaus.documents.graph = qualite/documents
fr.insee.rmes.bauhaus.documents.baseURI = documents/document
fr.insee.rmes.bauhaus.links.baseURI = documents/page

#OPERATIONS - INDICATEURS
fr.insee.rmes.bauhaus.products.graph = produits
fr.insee.rmes.bauhaus.products.baseURI = produits/indicateur


###############################
#STRUCTURES
###############################
fr.insee.rmes.bauhaus.structures.graph = structures
fr.insee.rmes.bauhaus.structures.baseURI = structuresDeDonnees/structure
fr.insee.rmes.bauhaus.structures.components.graph = composants
fr.insee.rmes.bauhaus.structures.components.baseURI = structuresDeDonnees/composants/


###############################
#CODELIST
###############################
fr.insee.rmes.bauhaus.codelists.graph = codes
fr.insee.rmes.bauhaus.codeList.baseURI=codes


###############################
#ORGANISATIONS
###############################
fr.insee.rmes.bauhaus.organisations.graph = organisations
fr.insee.rmes.bauhaus.insee.graph = organisations/insee

###############################
# GEOGRAPHIE (COG)
###############################
fr.insee.rmes.bauhaus.geographie.graph = geo/cog

###############################
# EXTENSIONS
###############################
fr.insee.rmes.bauhaus.extensions = pdf,xls,odt,xlsx,ods,zip

# La configuration Colectica (prefixe fr.insee.rmes.bauhaus.colectica) est definie
# dans colectica.yml, importe apres ce fichier via spring.config.import.
