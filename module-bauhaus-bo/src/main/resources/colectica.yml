fr.insee.rmes.bauhaus.colectica:
  langs:
    - fr-FR
    - en-GB
  init: false
  mock-server-enabled: false

  server:
    # Primary Colectica Instance
    itemTypes:
      PhysicalInstance: a51e85bb-6259-4488-8df2-f08cb43485f8
      LogicalProduct: 965c8d28-7d48-4950-bea7-04b27e52bb9b
      DataRelationship: f39ff278-8500-45fe-a850-3906da2d242b
      Variable: 683889c6-f74b-4d5e-92ed-908c0a42bb2d
      CodeList: 8b108ef8-b642-4484-9c49-f88e4bf7cf1d
      CodeListScheme: 4193d389-b5ae-4368-b399-cd5a7ee3653c
      CodeListGroup: 394b9ff3-7248-4ede-b945-9bebdbf56bed
      Category: 7e47c269-bcab-40f7-a778-af7bbc4e3d00
      StudyUnit: 30ea0200-7121-4f01-8d21-a931a182b86d
    versionResponsibility: abcde
    itemFormat: DC337820-AF3A-4C0B-82F9-CF02535CDE83
    baseUrl: https://metadonnees-operations-demo.insee.fr/
    apiPath: /api/v1/
    defaultAgencyId: fr.insee

    # Authentication mode:
    # - "password": Uses username/password credentials to obtain a token from /token/createtoken endpoint.
    #               The token is cached and automatically refreshed on 401/403 errors.
    # - "token": Uses a pre-configured static token directly (no API call to obtain token).
    #            Useful for environments with pre-generated long-lived tokens.
    authenticationMode: password

    # Credentials for "password" authentication mode
    # Provide via environment variables (COLECTICA_USERNAME / COLECTICA_PASSWORD)
    # or override in environment-specific configuration files. NEVER commit real values.
    username: ${COLECTICA_USERNAME:}
    password: ${COLECTICA_PASSWORD:}

    # Static token for "token" authentication mode
    # Provide via COLECTICA_TOKEN env var. NEVER commit real values.
    token: ${COLECTICA_TOKEN:}

  # Package racine dont l'arborescence est parcourue pour exposer les code lists mutualisées
  # via /ddi/mutualized-codes-list. Absent = aucune code list mutualisée (l'application démarre normalement).
  mutualized-codes-package:
    agency-id: fr.insee
    identifier: e129238f-485f-40b4-b52f-5702c05d5f40
    version: 1

  # Durée de mise en cache in-process des code lists mutualisées (format Spring Duration : 24h, 30m, 90s...).
  # Absent = 24h par défaut.
  mutualized-codes-cache-ttl: 24h
