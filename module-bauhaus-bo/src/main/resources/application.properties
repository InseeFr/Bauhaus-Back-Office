# For executions within insee context, overrides properties using spring.config.additional-location parameter on command line
spring.config.import=classpath:bauhaus.yml,classpath:bauhaus-core.properties,optional:classpath:bauhaus-local-dev.properties,classpath:rbac.yml,classpath:custom-validation-fields.yml,classpath:colectica.yml

# sprin-g boot config
spring.application.name=Bauhaus-Back-Office
server.port=8080

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB

fr.insee.rmes.bauhaus.version=@project.version@

spring.threads.virtual.enabled=false

server.servlet.contextPath=/api/

# Documentation OpenAPI / Swagger UI : coupée par défaut, à ouvrir environnement par environnement
# (fr.insee.rmes.bauhaus.swagger.enabled=true). UI : <contextPath>/swagger-ui.html, document : <contextPath>/v3/api-docs.
fr.insee.rmes.bauhaus.swagger.enabled=false
springdoc.api-docs.enabled=${fr.insee.rmes.bauhaus.swagger.enabled}
springdoc.swagger-ui.enabled=${fr.insee.rmes.bauhaus.swagger.enabled}
springdoc.swagger-ui.path=/swagger-ui.html
# L'application n'expose aucun repository Spring Data REST ; l'intégration springdoc correspondante,
# tirée par spring-data-rest-hal-explorer, ne ferait qu'échouer au démarrage.
springdoc.enable-data-rest=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${fr.insee.rmes.bauhaus.keycloak.server.url}/realms/${fr.insee.rmes.bauhaus.keycloak.defaultrealm.name}

# to log exchanges with repo rdf, switch to debug
logging.level.org.apache.http.wire=info
# to log sparql queries and results, switch to trace
logging.level.fr.insee.rmes.graphdb.RepositoryUtils=info

properties.logger.prefix-for-properties=fr.insee,logging,keycloak,spring,application,server,springdoc,management,minio,elastic
