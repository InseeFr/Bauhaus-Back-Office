services:
  minio:
    # pgsty/minio (fork communautaire maintenu) : MinIO ne publie plus d'image
    # publique, `minio/minio` (Docker Hub) comme `quay.io/minio/minio` refusent le pull.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data: