name: Build Beta

# Publishes the image of a prerelease on ghcr.io. The build itself lives in
# InseeFr/rmes-githubactions-commons, shared with the other RMéS projects.

on:
  release:
    types: [prereleased]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: InseeFr/rmes-githubactions-commons/.github/actions/docker-publish@main
        with:
          image: inseefr/bauhaus-back-office
          registry: ghcr.io
          dockerfile: Dockerfile.bauhaus
