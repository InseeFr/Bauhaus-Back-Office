name: Build release candidate

# Publishes the image of a final release on Docker Hub, as :<version> and
# :latest. The build itself lives in InseeFr/rmes-githubactions-commons, shared
# with the other RMéS projects.

on:
  release:
    types: [released]

jobs:
  docker:
    uses: InseeFr/rmes-githubactions-commons/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image: inseefr/bauhaus-back-office
      dockerfile: Dockerfile.bauhaus
      latest: true
